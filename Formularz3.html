<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz 3 - Igor Gorzoch</title>
    <style>
        @font-face {
            font-family: 'inter18italic';
            src: url('Inter_18pt-BlackItalic.ttf') format('truetype');
        }

        body {
            background-image: url('zdjecie3formularz.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: 'inter18italic', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-top: 20px;
            font-size: 22px;
            font-weight: 900;
        }

        header hr {
            width: 30%;
            height: 4px;
            border: none;
            background-color: snow;
            margin: 10px auto 0 auto;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 40px;
        }

        .b {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 500px;
        }

        .question-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .question-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .select-group select {
            padding: 4px 8px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            color: #000000;
            cursor: pointer;
        }

        .btn-reset {
            padding: 4px 10px;
            font-size: 14px;
            background-color: #e0e0e0;
            border: 1px solid #999999;
            border-radius: 3px;
            cursor: pointer;
            color: #000000;
        }

        .btn-reset:hover {
            background-color: #d0d0d0;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            color: #ffffff;
            cursor: pointer;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .radio-item input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-submit {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #2ecc71;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-family: 'inter18italic', sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-start;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <header>
        <b>IGOR GORZOCH FORMULARZE</b>
        <hr>
    </header>

    <div class="container">
        <form class="b" action="#" method="post">
            <div class="question-block">
                <label for="browser" class="question-title">Z jakiej przeglądarki internetowej korzystasz najczęściej?</label>
                <div class="select-group">
                    <select id="browser" name="browser">
                        <option value="chrome">Google Chrome</option>
                        <option value="firefox">Mozilla Firefox</option>
                        <option value="brave">Brave</option>
                        <option value="edge">Microsoft Edge</option>
                        <option value="opera">Opera</option>
                    </select>
                    <button type="reset" class="btn-reset">Wyczyść dane</button>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">Jaki Twój samochód ma napęd?</div>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="naped" value="przedni" required>
                        Przedni
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="naped" value="tylny">
                        Tylny
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="naped" value="4x4">
                        Napęd na 4 koła
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Wyślij</button>
        </form>
    </div>

</body>
</html>
